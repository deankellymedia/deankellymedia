<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automotive Photography | Dean Kelly Media</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        :root {
            --bg-color: #0b0c10;
            --card-bg: #13141a;
            --accent-color: #00e5ff;
            --text-main: #f0f2f5;
            --text-muted: #8c92a0;
            --border-color: #20232d;
            --nav-height: 70px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding-top: var(--nav-height);
        }

        /* NAVIGATION BAR */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            height: var(--nav-height);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5%;
            background: rgba(11, 12, 16, 0.95);
            backdrop-filter: blur(12px);
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-main);
        }

        .logo span { color: var(--accent-color); }

        .back-link {
            color: var(--accent-color);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: opacity 0.3s;
        }

        .back-link:hover { opacity: 0.8; }

        /* HEADER SECTION */
        .gallery-header {
            padding: 60px 5% 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-tag {
            color: var(--accent-color);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .gallery-title {
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 800;
            margin: 10px 0;
        }

        .gallery-desc {
            color: var(--text-muted);
            max-width: 650px;
            font-size: 1.05rem;
        }

        /* PHOTO GRID */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px 5% 80px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .photo-item {
            position: relative;
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            cursor: pointer;
            aspect-ratio: 16 / 10;
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease, filter 0.4s ease;
        }

        .photo-item:hover img {
            transform: scale(1.04);
            filter: brightness(1.1);
        }

        /* LIGHTBOX POPUP */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .lightbox.active { display: flex; }

        .lightbox img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 6px;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.2);
        }

        .lightbox-close {
            position: absolute;
            top: 25px;
            right: 30px;
            color: #fff;
            font-size: 2.5rem;
            cursor: pointer;
            transition: color 0.3s;
        }

        .lightbox-close:hover { color: var(--accent-color); }

        footer {
            text-align: center;
            padding: 30px 5%;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <!-- NAV -->
    <nav>
        <div class="logo">Dean Kelly<span>.</span></div>
        <a href="index.html#photo" class="back-link">&larr; Back to Portfolio</a>
    </nav>

    <!-- HEADER -->
    <div class="gallery-header">
        <span class="gallery-tag">Commercial & Track</span>
        <h1 class="gallery-title">Automotive Photography</h1>
        <p class="gallery-desc">Dynamic rolling shots, detailed interior/exterior stills, and high-impact commercial visuals highlighting automotive design and motion.</p>
    </div>

    <!-- GALLERY GRID (Swap img URLs with your actual photo uploads) -->
    <div class="gallery-grid">
        <div class="photo-item"><img src="https://images.unsplash.com/photo-1617814076367-b759c7d7e738?auto=format&fit=crop&w=1200&q=80" alt="Automotive Shot 1"></div>
        <div class="photo-item"><img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1200&q=80" alt="Automotive Shot 2"></div>
        <div class="photo-item"><img src="https://images.unsplash.com/photo-1544829099-b9a0c07fad1a?auto=format&fit=crop&w=1200&q=80" alt="Automotive Shot 3"></div>
        <div class="photo-item"><img src="https://images.unsplash.com/photo-1580273916550-e323be2ae537?auto=format&fit=crop&w=1200&q=80" alt="Automotive Shot 4"></div>
        <div class="photo-item"><img src="https://images.unsplash.com/photo-1552519507-da3b142c6e3d?auto=format&fit=crop&w=1200&q=80" alt="Automotive Shot 5"></div>
        <div class="photo-item"><img src="https://images.unsplash.com/photo-1605559424843-9e4c228bf1c2?auto=format&fit=crop&w=1200&q=80" alt="Automotive Shot 6"></div>
    </div>

    <!-- LIGHTBOX MODAL -->
    <div class="lightbox" id="lightbox">
        <span class="lightbox-close" id="lightbox-close">&times;</span>
        <img id="lightbox-img" src="" alt="Enlarged View">
    </div>

    <footer>
        <p>&copy; 2026 Dean Kelly Media. All rights reserved.</p>
    </footer>

    <!-- INTERACTIVE LIGHTBOX JS -->
    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const closeBtn = document.getElementById('lightbox-close');
        const photoItems = document.querySelectorAll('.photo-item img');

        photoItems.forEach(img => {
            img.addEventListener('click', () => {
                lightboxImg.src = img.src;
                lightbox.classList.add('active');
            });
        });

        closeBtn.addEventListener('click', () => {
            lightbox.classList.remove('active');
        });

        lightbox.addEventListener('click', (e) => {
            if (e.target !== lightboxImg) {
                lightbox.classList.remove('active');
            }
        });
    </script>
</body>
</html>
