<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portraits | Dean Kelly</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  
  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: #1f2833;
      --text-main: #c5c6c7;
      --text-bright: #ffffff;
      --accent-cyan: #00e5ff;
      --font-mono: 'Courier New', Courier, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-sans);
      padding-bottom: 80px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 5%;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background-color: rgba(11, 12, 16, 0.95);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
    }

    .brand-title {
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--text-bright);
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 5%;
    }

    .gallery-header {
      margin: 3rem 0 2rem 0;
      font-family: var(--font-mono);
    }

    .gallery-header h1 {
      font-size: 2rem;
      color: var(--text-bright);
    }

    .gallery-header p {
      color: var(--accent-cyan);
      font-size: 0.85rem;
      letter-spacing: 1.5px;
    }

    /* Masonry / Responsive Stills Grid */
    .stills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .still-card {
      position: relative;
      background-color: var(--card-bg);
      border-radius: 4px;
      overflow: hidden;
      aspect-ratio: 4 / 5;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .still-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.9;
      transition: transform 0.4s ease, opacity 0.4s ease;
    }

    .still-card:hover img {
      opacity: 1;
      transform: scale(1.04);
    }

    .loading-text {
      font-family: var(--font-mono);
      color: var(--accent-cyan);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="brand-title">← DEAN KELLY</a>
    <nav style="font-family: var(--font-mono); font-size: 0.85rem;">
      <a href="index.html#stills" style="color: var(--accent-cyan);">// STILLS ARCHIVE</a>
    </nav>
  </header>

  <main class="container">
    <div class="gallery-header">
      <p>// ARCHIVE COLLECTION</p>
      <h1>PORTRAITURE</h1>
    </div>

    <!-- Dynamic Image Grid -->
    <section class="stills-grid" id="gallery-grid">
      <p class="loading-text" id="loading-state">FETCHING CLOUDINARY MEDIA TRANSMISSIONS...</p>
    </section>
  </main>

  <script>
    const CLOUD_NAME = 'ewjbbwte'; 
const TAG_NAME = 'portraits'; // Tag applied to images in Cloudinary

async function fetchCloudinaryImages() {
  const grid = document.getElementById('gallery-grid');
  const loading = document.getElementById('loading-state');

  try {
    // Fetch image list by tag
    const response = await fetch(`https://res.cloudinary.com/${CLOUD_NAME}/image/list/${TAG_NAME}.json`);
    
    if (!response.ok) {
      throw new Error(`HTTP error! Status: ${response.status}`);
    }

    const data = await response.json();
    loading.remove();

    data.resources.forEach(img => {
      const card = document.createElement('div');
      card.className = 'still-card';
      
      const optimizedSrc = `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/f_auto,q_auto,w_800/v${img.version}/${img.public_id}.${img.format}`;
      
      card.innerHTML = `<img src="${optimizedSrc}" alt="Dean Kelly Photography" loading="lazy">`;
      grid.appendChild(card);
    });

  } catch (err) {
    console.error('Cloudinary Fetch Error:', err);
    loading.innerHTML = `Unable to load gallery. Ensure Resource List access is enabled in Cloudinary Security settings and images are tagged as <code>${TAG_NAME}</code>.`;
  }
}

fetchCloudinaryImages();
  </script>
</body>
</html>
