<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dean Kelly | Complete Photography Archive</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
:root{--bg-color:#0b0c10;--card-bg:#1f2833;--text-main:#c5c6c7;--text-bright:#fff;--accent-cyan:#00e5ff;--font-mono:'Courier New',Courier,monospace;--font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-color);color:var(--text-main);font-family:var(--font-sans);line-height:1.6;padding-bottom:80px}
a{color:inherit;text-decoration:none}
header{display:flex;justify-content:space-between;align-items:center;padding:1.5rem 5%;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(11,12,16,.95);position:sticky;top:0;z-index:100;backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:12px}.brand-logo-svg{width:32px;height:32px}.brand-title{font-weight:700;letter-spacing:2px;color:var(--text-bright);font-size:1.1rem}
nav ul{display:flex;list-style:none;gap:2rem;font-family:var(--font-mono);font-size:.85rem;text-transform:uppercase;letter-spacing:1px}nav a:hover{color:var(--accent-cyan);transition:color .2s}
.container{max-width:1280px;margin:0 auto;padding:0 5%}
.back-btn{display:inline-flex;align-items:center;gap:8px;margin-top:2rem;font-family:var(--font-mono);font-size:.85rem;color:var(--accent-cyan);text-transform:uppercase;letter-spacing:1.5px}
.gallery-header{margin:2rem 0 2rem}.gallery-header p{font-family:var(--font-mono);font-size:.85rem;color:var(--accent-cyan);letter-spacing:1.5px;text-transform:uppercase}.gallery-header h1{font-family:var(--font-mono);font-size:clamp(1.8rem,4vw,2.8rem);color:var(--text-bright);letter-spacing:1px;text-transform:uppercase;margin-top:.2rem}.gallery-header .intro{font-family:var(--font-sans);color:var(--text-main);letter-spacing:0;text-transform:none;font-size:1rem;margin-top:.65rem}
.filters{display:flex;flex-wrap:wrap;gap:.65rem;margin:0 0 1.5rem}.filter-btn{font-family:var(--font-mono);font-size:.78rem;letter-spacing:1px;text-transform:uppercase;color:var(--text-main);background:transparent;border:1px solid rgba(255,255,255,.18);padding:.7rem 1rem;border-radius:3px;cursor:pointer;transition:.2s}.filter-btn:hover,.filter-btn.active{color:var(--accent-cyan);border-color:var(--accent-cyan);background:rgba(0,229,255,.06)}
.archive-meta{font-family:var(--font-mono);font-size:.75rem;color:rgba(197,198,199,.7);letter-spacing:1px;margin-bottom:1rem}
.stills-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.25rem}
.still-card{position:relative;background:var(--card-bg);border:1px solid rgba(255,255,255,.05);border-radius:4px;overflow:hidden;cursor:pointer;aspect-ratio:4/5;transition:transform .3s,border-color .3s}.still-card:hover{transform:translateY(-5px);border-color:var(--accent-cyan)}.still-card img{width:100%;height:100%;object-fit:cover;opacity:.9;transition:transform .4s,opacity .4s}.still-card:hover img{opacity:1;transform:scale(1.04)}.card-tag{position:absolute;left:10px;bottom:10px;background:rgba(11,12,16,.82);color:var(--accent-cyan);font: .68rem var(--font-mono);letter-spacing:1px;text-transform:uppercase;padding:5px 8px;border-radius:2px}
.status{font-family:var(--font-mono);color:var(--accent-cyan);letter-spacing:1px;grid-column:1/-1;padding:1rem 0}.status.error{color:#ffb4a8}
.lightbox{display:none;position:fixed;inset:0;width:100%;height:100%;background:rgba(11,12,16,.96);backdrop-filter:blur(10px);z-index:1000;justify-content:center;align-items:center;padding:55px 20px 65px}.lightbox.active{display:flex}.lightbox-content{max-width:90%;max-height:85vh;border-radius:4px;box-shadow:0 10px 30px rgba(0,0,0,.8);border:1px solid rgba(255,255,255,.1);object-fit:contain}.lightbox-close{position:absolute;top:18px;right:28px;font:2.2rem var(--font-mono);color:#fff;cursor:pointer;background:none;border:0}.lightbox-close:hover{color:var(--accent-cyan)}.lightbox-caption{position:absolute;bottom:22px;font: .8rem var(--font-mono);color:var(--accent-cyan);letter-spacing:1.5px;text-transform:uppercase;text-align:center}
@media(max-width:768px){header{padding:1rem 5%}nav ul{gap:.8rem;font-size:.7rem}.brand-title{font-size:.95rem}.brand-logo-svg{width:28px;height:28px}.stills-grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:.8rem}.filter-btn{padding:.6rem .75rem;font-size:.7rem}}
</style>
</head>
<body>
<header>
    <a href="#" class="brand">
      <!-- Anamorphic Prism Logo -->
      <svg class="brand-logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="50,15 82,33 82,67 50,85 18,67 18,33" stroke="rgba(255,255,255,0.25)" stroke-width="2" />
        <path d="M 18 50 L 82 50" stroke="#00e5ff" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M 50 15 L 82 67 L 18 67 Z" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" fill="none"/>
        <circle cx="50" cy="50" r="5" fill="#00e5ff" />
      </svg>
      <span class="brand-title">DEAN KELLY</span>
    </a>

    <nav>
      <ul>
        <li><a href="films.html">Films</a></li>
        <li><a href="all-photos.html">Photography</a></li>
        <li><a href="index.html#about">About</a></li>
      </ul>
    </nav>
  </header>
<main class="container">
<a href="index.html#stills" class="back-btn">&larr; Return to Main Portfolio</a>
<div class="gallery-header"><p>// COMPLETE COLLECTION</p><h1>THE PHOTOGRAPHY ARCHIVE</h1><p class="intro">A collection of work across every photographic category.</p></div>
<div class="filters" role="group" aria-label="Filter photographs">
<button class="filter-btn active" data-filter="all">All</button>
<button class="filter-btn" data-filter="graphic">Graphic</button>
<button class="filter-btn" data-filter="automotive">Automotive</button>
<button class="filter-btn" data-filter="portraits">Portraits</button>
<button class="filter-btn" data-filter="urban">Urban</button>
</div>
<div class="archive-meta" id="archive-meta">LOADING COLLECTIONS...</div>
<section class="stills-grid" id="gallery-grid" aria-live="polite"><p class="status">FETCHING CLOUDINARY MEDIA TRANSMISSIONS...</p></section>
</main>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Enlarged photograph">
<button class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button><img class="lightbox-content" id="lightbox-img" src="" alt="Enlarged photograph"><div class="lightbox-caption" id="lightbox-caption"></div>
</div>
<script>
const CLOUD_NAME='ewjbbwte';
const TAGS=['graphic','automotive','portraits','urban'];
let allImages=[];
let activeFilter='all';
const grid=document.getElementById('gallery-grid');
const meta=document.getElementById('archive-meta');
const label=t=>t.charAt(0).toUpperCase()+t.slice(1);
function imageUrl(img,transforms='f_auto,q_auto'){return `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/${transforms}/v${img.version}/${img.public_id}.${img.format}`;}
function render(){
grid.innerHTML='';
const shown=activeFilter==='all'?allImages:allImages.filter(img=>img.categories.includes(activeFilter));
meta.textContent=`${shown.length} PHOTOGRAPH${shown.length===1?'':'S'} // ${activeFilter==='all'?'ALL CATEGORIES':activeFilter.toUpperCase()}`;
if(!shown.length){grid.innerHTML='<p class="status">NO PHOTOGRAPHS FOUND FOR THIS CATEGORY.</p>';return;}
shown.forEach(img=>{
const card=document.createElement('button');card.type='button';card.className='still-card';card.setAttribute('aria-label',`Open ${img.categories.map(label).join(', ')} photograph`);
const image=document.createElement('img');image.src=imageUrl(img,'f_auto,q_auto,w_800');image.alt=`Dean Kelly ${img.categories.map(label).join(' and ')} Photography`;image.loading='lazy';
const tag=document.createElement('span');tag.className='card-tag';tag.textContent=img.categories.map(label).join(' / ');
card.append(image,tag);card.addEventListener('click',()=>openLightbox(img));grid.appendChild(card);
});
}
async function fetchTag(tag){
const response=await fetch(`https://res.cloudinary.com/${CLOUD_NAME}/image/list/${tag}.json`);
if(!response.ok)throw new Error(`${tag}: HTTP ${response.status}`);
const data=await response.json();return (data.resources||[]).map(img=>({...img,categories:[tag]}));
}
async function loadArchive(){
const results=await Promise.allSettled(TAGS.map(fetchTag));
const byId=new Map();const failed=[];
results.forEach((result,index)=>{
if(result.status==='rejected'){failed.push(TAGS[index]);return;}
result.value.forEach(img=>{
const key=img.public_id;
if(byId.has(key)){const existing=byId.get(key);if(!existing.categories.includes(TAGS[index]))existing.categories.push(TAGS[index]);}
else byId.set(key,img);
});
});
allImages=[...byId.values()];
if(!allImages.length){
grid.innerHTML=`<p class="status error">Unable to load the galleries. Check Cloudinary Resource List access and confirm images are tagged: ${TAGS.join(', ')}.</p>`;
meta.textContent='COLLECTIONS UNAVAILABLE';return;
}
allImages.sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||''));
meta.textContent=failed.length?`LOADED ${allImages.length} PHOTOGRAPHS // SOME TAGS UNAVAILABLE: ${failed.join(', ').toUpperCase()}`:`LOADED ${allImages.length} PHOTOGRAPHS // 4 CATEGORIES`;
render();
}
function openLightbox(img){
document.getElementById('lightbox-img').src=imageUrl(img);
document.getElementById('lightbox-caption').textContent=`${img.categories.map(label).join(' / ')} // ${img.public_id.toUpperCase()}`;
document.getElementById('lightbox').classList.add('active');
document.body.style.overflow='hidden';
}
function closeLightbox(){document.getElementById('lightbox').classList.remove('active');document.getElementById('lightbox-img').src='';document.body.style.overflow='';}
document.querySelectorAll('.filter-btn').forEach(button=>button.addEventListener('click',()=>{
activeFilter=button.dataset.filter;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b===button));render();
}));
document.getElementById('lightbox-close').addEventListener('click',closeLightbox);
document.getElementById('lightbox').addEventListener('click',event=>{if(event.target.id==='lightbox')closeLightbox();});
document.addEventListener('keydown',event=>{if(event.key==='Escape')closeLightbox();});
loadArchive();
</script>
</body>
</html>
